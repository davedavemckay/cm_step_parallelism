includeConfigs:
  - ${DRP_PIPE_DIR}/bps/clustering/LSSTCam/DRP-clustering.yaml
  - ${DRP_PIPE_DIR}/bps/resources/LSSTCam/DRP.yaml
  - ${DRP_PIPE_DIR}/bps/compression/LSSTCam/DRP-compression.yaml
  - ${DRP_PIPE_DIR}/bps/caching/LSSTCam/LANCS/DRP-caching.yaml
  - htc-remote.yaml

# Wave 8 (Runs immediately after step4a2-diffim.yaml + step4b.yaml):
# Subgraph 1 of step4c: DIA Source association, DiaObject calculation & consolidation, and DiaObject forced photometry.
# Does NOT require step3a3-multiband-objects.yaml (object_patch) or step2e-step2f.yaml! Can run while Scarlet/MultiProFit is still running.
# Preserves both the 'association' cluster (associateDiaSource, calculateDiaObject) and the 'step4c_forced_phot_dia' cluster
# (forcedPhotDiaObjectDetector, caching dia_object_patch across all detectors of a visit).
pipelineYaml: "${DRP_PIPE_DIR}/pipelines/LSSTCam/DRP.yaml#associateDiaSource,calculateDiaObject,consolidateDiaSource,consolidateDiaObject,analyzeDiaSourceTableTract,forcedPhotDiaObjectDetector,standardizeDiaObjectForcedSource"

priority: 999

wmsConfig:
  DAGMAN_AGGRESSIVE_SUBMIT: true
  DAGMAN_MAX_JOBS_IDLE: 50000

payload:
  runInit: true
  payloadName: lsstcam_drp
  butlerConfig: "dp2_prep"
  inCollection: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  output: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  dataQuery: >-
    instrument='LSSTCam' and skymap='lsst_cells_v2' and tract in (2234)

numberOfRetries: 4
retryUnlessExit: [2]
memoryMultiplier: 2
overwriteJobFiles: false

finalJob:
  requestCpus: 16
  requestMemory: 160000
  numberOfRetries: 5

extraRunQuantumOptions: "--no-raise-on-partial-outputs"
extraQgraphOptions: "--dataset-query-constraint visit_summary,dia_source_detector"
# extraQgraphOptions: "--dataset-query-constraint visit_summary,dia_source_detector --skip-existing-in {output} --clobber-outputs"

lsstVersion: "w_2026_44"

computeSite: LANCS

buildQuantumGraph:
  requestMemory: 128000
project: dev
campaign: tracking
