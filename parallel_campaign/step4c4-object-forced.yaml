includeConfigs:
  - ${DRP_PIPE_DIR}/bps/clustering/LSSTCam/DRP-clustering.yaml
  - ${DRP_PIPE_DIR}/bps/resources/LSSTCam/DRP.yaml
  - ${DRP_PIPE_DIR}/bps/compression/LSSTCam/DRP-compression.yaml
  - ${DRP_PIPE_DIR}/bps/caching/LSSTCam/LANCS/DRP-caching.yaml
  - htc-remote.yaml

# Wave 8 (Runs after step3a3-multiband-objects.yaml and step4a2-diffim.yaml):
# Subgraph 4 of step4c: Forced photometry on visit_image and difference_image at static coadd Object positions.
# Requires object_patch (from step3a3-multiband-objects.yaml), visit_image (from step4a1), and difference_image (from step4a2).
# Does NOT require step4b.yaml or step2e-step2f.yaml!
# Preserves the 'step4c_forced_phot' cluster (forcedPhotObjectDetector, caching object_patch across all detectors of a visit).
pipelineYaml: "${DRP_PIPE_DIR}/pipelines/LSSTCam/DRP.yaml#forcedPhotObjectDetector,standardizeObjectForcedSource,splitPrimaryObjectForcedSource"

priority: 999

wmsConfig:
  DAGMAN_AGGRESSIVE_SUBMIT: true
  DAGMAN_MAX_JOBS_IDLE: 50000

payload:
  runInit: true
  payloadName: lsstcam_drp
  butlerConfig: "dp2_prep"
  inCollection: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  output: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  dataQuery: >-
    instrument='LSSTCam' and skymap='lsst_cells_v2' and tract in (2234)

numberOfRetries: 4
retryUnlessExit: [2]
memoryMultiplier: 2
overwriteJobFiles: false

finalJob:
  requestCpus: 16
  requestMemory: 160000
  numberOfRetries: 5

extraRunQuantumOptions: "--no-raise-on-partial-outputs"
extraQgraphOptions: "--dataset-query-constraint object_patch,difference_image"
# extraQgraphOptions: "--dataset-query-constraint object_patch,difference_image --skip-existing-in {output} --clobber-outputs"

lsstVersion: "w_2026_44"

computeSite: LANCS

buildQuantumGraph:
  requestMemory: 128000
project: dev
campaign: tracking
