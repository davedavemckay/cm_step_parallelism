includeConfigs:
  - ${DRP_PIPE_DIR}/bps/clustering/LSSTCam/DRP-clustering.yaml
  - ${DRP_PIPE_DIR}/bps/resources/LSSTCam/DRP.yaml
  - ${DRP_PIPE_DIR}/bps/compression/LSSTCam/DRP-compression.yaml
  - ${DRP_PIPE_DIR}/bps/caching/LSSTCam/LANCS/DRP-caching.yaml
  - htc-remote.yaml

# Wave 6: Coadd image assembly + single-band peak detection + tract/binned coadd images.
# Runs immediately after step3a1-warps.yaml (does NOT wait for step2e-step2f, step4b, or step4a1).
# Preserves the full 'coadd' cluster (selectDeepCoaddVisits, assembleDeepCoadd, assembleCellCoadd,
# detectCoaddPeaks, selectTemplateCoaddVisits, assembleTemplateCoadd) so psf_matched_warp is cached
# locally once per (tract, patch, band) and shared between Deep, Cell, and Template coadds.
# Separating this from Scarlet deblending / MultiProFit (step3a3-multiband-objects.yaml) immediately
# produces template_coadd, deep_coadd, and deep_coadd_visit_selection to unblock step4a2-diffim.yaml
# and step4c1-pretty-coadds.yaml in Wave 7!
pipelineYaml: "${DRP_PIPE_DIR}/pipelines/LSSTCam/DRP.yaml#selectDeepCoaddVisits,assembleDeepCoadd,assembleCellCoadd,detectCoaddPeaks,selectTemplateCoaddVisits,assembleTemplateCoadd,makeBinnedCoaddImage,makeBinnedDeepNImage,makeBinnedTemplateNImage,makeWholeTractImage,makeWholeTractDeepNImage,makeWholeTractTemplateNImage,makeDeepCoaddInputSummaryTract,makeTemplateCoaddInputSummaryTract"

priority: 999

wmsConfig:
  DAGMAN_AGGRESSIVE_SUBMIT: true
  DAGMAN_MAX_JOBS_IDLE: 50000

payload:
  runInit: true
  payloadName: lsstcam_drp
  butlerConfig: "dp2_prep"
  inCollection: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  output: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  dataQuery: >-
    instrument='LSSTCam' and skymap='lsst_cells_v2' and tract in (2234)

numberOfRetries: 4
retryUnlessExit: [2]
memoryMultiplier: 2
overwriteJobFiles: false

finalJob:
  requestCpus: 16
  requestMemory: 160000
  numberOfRetries: 5

extraRunQuantumOptions: "--no-raise-on-partial-outputs"
extraQgraphOptions: "--dataset-query-constraint visit_summary"
# extraQgraphOptions: "--dataset-query-constraint visit_summary --skip-existing-in {output} --clobber-outputs"

lsstVersion: "w_2026_44"

computeSite: LANCS

buildQuantumGraph:
  requestMemory: 128000
project: dev
campaign: tracking
