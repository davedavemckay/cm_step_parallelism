includeConfigs:
  - ${DRP_PIPE_DIR}/bps/clustering/LSSTCam/DRP-clustering.yaml
  - ${DRP_PIPE_DIR}/bps/resources/LSSTCam/DRP.yaml
  - ${DRP_PIPE_DIR}/bps/compression/LSSTCam/DRP-compression.yaml
  - ${DRP_PIPE_DIR}/bps/caching/LSSTCam/LANCS/DRP-caching.yaml
  - htc-remote.yaml

# Wave 7 (Parallel with step3a3-multiband-objects and step4a2-diffim):
# Subgraph 3 of step4c: Sky-corrected Pretty Coadd warps, assembly, and binned/whole-tract images.
# Only requires step2d (visit_summary), step3a2-coadd-images (deep_coadd_visit_selection), and
# step4a1-reprocess-skycorr (visit_image, skyCorr).
# Does NOT require step4a2-diffim, step4b, step3a3-multiband-objects (object_patch), or step2e-step2f!
# Preserves makeWarpTract, make_analysis_images, and make_tract_analysis_images clusters.
pipelineYaml: "${DRP_PIPE_DIR}/pipelines/LSSTCam/DRP.yaml#makePrettyDirectWarp,makePrettyPsfMatchedWarp,assemblePrettyCoadd,makeBinnedPrettyCoaddImage,makeBinnedPrettyNImage,makeWholeTractPrettyCoaddImage,makeWholeTractPrettyNImage"

priority: 999

wmsConfig:
  DAGMAN_AGGRESSIVE_SUBMIT: true
  DAGMAN_MAX_JOBS_IDLE: 50000

payload:
  runInit: true
  payloadName: lsstcam_drp
  butlerConfig: "dp2_prep"
  inCollection: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  output: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  dataQuery: >-
    instrument='LSSTCam' and skymap='lsst_cells_v2' and tract in (2234)

numberOfRetries: 4
retryUnlessExit: [2]
memoryMultiplier: 2
overwriteJobFiles: false

finalJob:
  requestCpus: 16
  requestMemory: 160000
  numberOfRetries: 5

extraRunQuantumOptions: "--no-raise-on-partial-outputs"
extraQgraphOptions: "--dataset-query-constraint visit_summary,deep_coadd_visit_selection"
# extraQgraphOptions: "--dataset-query-constraint visit_summary,deep_coadd_visit_selection --skip-existing-in {output} --clobber-outputs"

lsstVersion: "w_2026_44"

computeSite: LANCS

buildQuantumGraph:
  requestMemory: 128000
project: dev
campaign: tracking
