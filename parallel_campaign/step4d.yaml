includeConfigs:
  - ${DRP_PIPE_DIR}/bps/clustering/LSSTCam/DRP-clustering.yaml
  - ${DRP_PIPE_DIR}/bps/resources/LSSTCam/DRP.yaml
  - ${DRP_PIPE_DIR}/bps/compression/LSSTCam/DRP-compression.yaml
  - ${DRP_PIPE_DIR}/bps/caching/LSSTCam/LANCS/DRP-caching.yaml
  - htc-remote.yaml

# Wave 9 (Terminal Global Leaf): Global Solar System table consolidation (consolidateSsTables) +
# global Source association metric table and whole-sky plot.
# Requires step4c3-dia-assoc-forced.yaml (ss_source_associated) and step4c2-source-qa.yaml (analysis_source_association_metrics).
# Does NOT require step4c1-pretty-coadds.yaml, step4c4-object-forced.yaml, or step3a3-multiband-objects.yaml!
# NOTE FOR REMOTE SITES: consolidateSsTables requests 480 GB RAM in bps/resources/LSSTCam/DRP.yaml.
# If remote worker nodes have <480 GB RAM, run this step locally at USDF (swap LANCS/DRP-caching.yaml
# for usdf/DRP-caching.yaml and comment out htc-remote.yaml and computeSite: LANCS).
pipelineYaml: "${DRP_PIPE_DIR}/pipelines/LSSTCam/DRP.yaml#step4d-measure-variability-global"

priority: 999

wmsConfig:
  DAGMAN_AGGRESSIVE_SUBMIT: true
  DAGMAN_MAX_JOBS_IDLE: 50000

payload:
  runInit: true
  payloadName: lsstcam_drp
  butlerConfig: "dp2_prep"
  inCollection: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  output: u/dmckayuk/{lsstVersion}/tracking_test/pll_steps
  dataQuery: >-
    instrument='LSSTCam' and skymap='lsst_cells_v2' and tract in (2234)

numberOfRetries: 4
retryUnlessExit: [2]
memoryMultiplier: 2
overwriteJobFiles: false

finalJob:
  requestCpus: 16
  requestMemory: 160000
  numberOfRetries: 5

extraRunQuantumOptions: "--no-raise-on-partial-outputs"
extraQgraphOptions: "--dataset-query-constraint ss_source_associated,analysis_source_association_metrics"
# extraQgraphOptions: "--dataset-query-constraint ss_source_associated,analysis_source_association_metrics --skip-existing-in {output} --clobber-outputs"

lsstVersion: "w_2026_44"

computeSite: LANCS

buildQuantumGraph:
  requestMemory: 128000
project: dev
campaign: tracking
